<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capitulation — Gold Vault</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-core: #fff4b0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: radial-gradient(circle at top, #2a1600, #090400 70%); overflow: hidden; font-family: 'Cinzel', serif; }
    canvas { position: fixed; inset: 0; z-index: 0; }
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

    #ticker { position: absolute; top: .6rem; left: 50%; transform: translateX(-50%); width: min(92vw, 820px); height: 24px; overflow: hidden; background: linear-gradient(180deg, #ffd96a, #3b2104); border: 1px solid #fff3b0; border-radius: 8px; box-shadow: inset 0 0 46px rgba(255,220,120,.95); }
    #tickerInner { display: flex; align-items: center; height: 100%; white-space: nowrap; animation: scroll 20s linear infinite; color: #fffbe0; font-size: .7rem; letter-spacing: .24em; padding-left: 100%; }
    #tickerInner span { margin-right: 2.6rem; }
    @keyframes scroll { to { transform: translateX(-100%); } }

    header { position: absolute; top: clamp(3rem, 7vh, 5.2rem); width: 100%; text-align: center; }
    header h1 { margin: 0; font-weight: 600; color: var(--gold-core); font-size: clamp(2.4rem, 9vw, 5.6rem); letter-spacing: clamp(0.18em, 1.8vw, 0.38em); transform: scaleY(1.28); text-shadow: 0 0 28px rgba(255,215,120,1), 0 0 88px rgba(255,190,60,.95); }

    #nav { position: absolute; top: clamp(6.2rem, 14vh, 8.8rem); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: .7rem; }
    #navTop { display: flex; gap: .7rem; }
    .nav-btn { min-width: 92px; padding: .6rem .8rem; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; border-radius: 9px; }
    .gold { background: radial-gradient(circle at top, #fffbd2, #ffda4a 45%, #ffae00 72%, #6a3300 100%); }
    .silver { background: radial-gradient(circle at top, #ffffff, #e9edf3 55%, #9aa3af 100%); }
    .platinum { background: radial-gradient(circle at top, #ffffff, #e3f4f1 55%, #6fa3a0 100%); }
    .ascension { min-width: 176px; padding: .85rem 1.2rem; letter-spacing: .34em; background: radial-gradient(circle at top, #ffffff, #f5eaff, #e3f7ff, #fdf1ff); animation: prism 5s linear infinite; }
    @keyframes prism { 50% { filter: hue-rotate(25deg) brightness(1.3); } }

    #walletBtn { position: fixed; bottom: 1.4rem; right: 1.4rem; padding: .65rem 1.7rem; color: rgba(255,255,255,.95); background: linear-gradient(135deg, rgba(255,255,255,.45), rgba(160,210,255,.18)); border-radius: 12px; backdrop-filter: blur(10px); }
  </style>
</head>
<body>
<canvas id="coinCanvas"></canvas>
<div id="ui">
  <div id="ticker"><div id="tickerInner"><span>CREDIT</span><span>DEBIT</span><span>BANK</span><span>PAYPAL</span><span>BTC</span><span>ETH</span></div></div>
  <header><h1>CAPITULATION</h1></header>
  <div id="nav"><div id="navTop"><button class="nav-btn gold">GOLD</button><button class="nav-btn silver">SILVER</button><button class="nav-btn platinum">PLATINUM</button></div><button class="nav-btn ascension">ASCENSION</button></div>
  <button id="walletBtn">CONNECT WALLET</button>
</div>
<script>
const canvas = document.getElementById('coinCanvas');
const ctx = canvas.getContext('2d');
let w, h;
function resize() { w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
window.addEventListener('resize', resize);
resize();

// Coin arrays
const falling = [];
const landed = [];
const MAX_FALLING = 200;
const gravity = 0.3;
const floorY = () => h - 10;

function spawnFalling() {
  if (falling.length < MAX_FALLING) {
    falling.push({ x: Math.random()*w, y: -20, r: 5+Math.random()*2, vy: Math.random()*1 + 0.5 });
  }
}

function drawCoin(c) {
  ctx.beginPath();
  ctx.arc(c.x, c.y, c.r, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,210,80,0.98)';
  ctx.fill();
  ctx.lineWidth = 1.4;
  ctx.strokeStyle = 'rgba(110,65,0,.95)';
  ctx.stroke();
  if(c.symbol){ ctx.fillStyle='rgba(120,70,0,.85)'; ctx.font=`${c.r*1.1}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(c.symbol,c.x,c.y+0.5); }
}

let t=0;
function animate() {
  ctx.clearRect(0,0,w,h);
  t += 0.01;

  spawnFalling();

  // Update falling coins
  for(let i=falling.length-1; i>=0; i--) {
    const c = falling[i];
    c.vy += gravity*0.1;
    c.y += c.vy;
    if(c.y + c.r >= floorY()) {
      c.y = floorY() - c.r;
      landed.push(c);
      falling.splice(i,1);
    } else {
      c.symbol = Math.random()<0.5?'$':'₿';
      drawCoin(c);
    }
  }

  // Draw landed coins with slight wave
  landed.forEach(c => {
    const wave = Math.sin(t + c.x*0.05)*2;
    c.symbol = Math.random()<0.05?'$':'₿';
    drawCoin({ x: c.x, y: c.y + wave, r: c.r, symbol: c.symbol });
  });

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
