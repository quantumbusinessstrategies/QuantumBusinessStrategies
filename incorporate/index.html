<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Capitulation</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold-core: #fff7b0;
      --gold-bright: #ffea6a;
      --gold-mid: #ffd24a;
      --gold-deep: #9a5a00;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #120900; overflow: hidden;
      font-family: 'Cinzel', serif;
    }
    #canvas { position: fixed; inset: 0; z-index: 0; }
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

    header {
      position: absolute;
      top: clamp(3rem, 8vh, 6rem);
      width: 100%;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-weight: 600;
      color: #fffbe6;
      white-space: nowrap;
      font-size: clamp(2.4rem, 9vw, 5.4rem);
      letter-spacing: clamp(0.16em, 1.6vw, 0.36em);
      transform: scaleY(1.25);
      text-shadow: 0 0 52px rgba(255,230,160,1);
    }

    #walletBtn {
      pointer-events: auto;
      margin-top: 1.6rem;
      padding: 0.85rem 2.4rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: #3a2200;
      background: linear-gradient(160deg,#ffffff,#ffeeb0,#ffd24a,#ffb800,#8a4f00);
      border: 1px solid #ffdf80;
      border-radius: 8px;
      box-shadow: inset 0 5px 0 rgba(255,255,255,1), inset 0 -6px 0 rgba(180,120,20,.95), 0 18px 46px rgba(0,0,0,.85);
      cursor: pointer;
    }

    #ticker {
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 760px);
      height: 28px;
      overflow: hidden;
      background: linear-gradient(180deg, #b88718, #3b2104);
      border: 1px solid #fff3b0;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,.85), inset 0 0 40px rgba(255,230,150,.95);
    }

    #tickerInner {
      display: flex;
      align-items: center;
      height: 100%;
      white-space: nowrap;
      animation: scroll 22s linear infinite;
      color: #fffbe0;
      font-size: .7rem;
      letter-spacing: .22em;
      padding-left: 100%;
    }
    #tickerInner span { margin-right: 2.2rem; }
    @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }
  </style>
</head>
<body>
  <div id="canvas"></div>

  <div id="ui">
    <div id="ticker">
      <div id="tickerInner">
        <span>CREDIT / DEBIT</span><span>BANK TRANSFER</span><span>PAYPAL</span><span>CASH APP</span><span>BTC</span><span>ETH</span>
      </div>
    </div>
    <header>
      <h1>CAPITULATION</h1>
      <button id="walletBtn">CONNECT WALLET</button>
    </header>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xffd96a, 90, 420);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 1, 1600);
    camera.position.set(0, 90, 360);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('canvas').appendChild(renderer.domElement);

    const textureCache = {};

    function createCoinTexture(symbol) {
      if (textureCache[symbol]) return textureCache[symbol];
      const c = document.createElement('canvas');
      c.width = c.height = 128;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(64,64,4,64,64,64);
      g.addColorStop(0,'#ffffff');
      g.addColorStop(.35,'#fff7b0');
      g.addColorStop(.6,'#ffea6a');
      g.addColorStop(.85,'#ffd24a');
      g.addColorStop(1,'#9a5a00');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(64,64,62,0,Math.PI*2); ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,235,1)'; ctx.stroke();
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,210,110,1)'; ctx.beginPath(); ctx.arc(64,64,52,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle = '#fffbe6'; ctx.font = 'bold 56px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(symbol,64,66);
      const tex = new THREE.CanvasTexture(c);
      textureCache[symbol] = tex;
      return tex;
    }

    const FLOOR = -230, SURFACE = -135, RADIUS = 190;

    const COUNT = 36000;
    const pilePos = new Float32Array(COUNT * 3);
    for (let i=0;i<COUNT;i++){
      const r=Math.pow(Math.random(),.45)*RADIUS,a=Math.random()*Math.PI*2;
      pilePos[i*3]=Math.cos(a)*r;
      pilePos[i*3+1]=FLOOR+Math.random()*45;
      pilePos[i*3+2]=Math.sin(a)*r;
    }
    const pileGeo=new THREE.BufferGeometry();
    pileGeo.setAttribute('position',new THREE.BufferAttribute(pilePos,3));
    const pileSets=[
      new THREE.Points(pileGeo.clone(),new THREE.PointsMaterial({map:createCoinTexture('$'),size:17,transparent:true,depthWrite:false})),
      new THREE.Points(pileGeo.clone(),new THREE.PointsMaterial({map:createCoinTexture('₿'),size:17,transparent:true,depthWrite:false}))
    ];
    pileSets.forEach(p=>scene.add(p));

    const FALL_COUNT = 220;
    const fallPos = new Float32Array(FALL_COUNT*3);
    const fallVel = new Float32Array(FALL_COUNT);

    function resetFaller(i, initial=false){
      fallPos[i*3]   = (Math.random() - .5) * RADIUS * 1.2;
      fallPos[i*3+1] = initial ? Math.random() * 380 : 380;
      fallPos[i*3+2] = (Math.random() - .5) * RADIUS * 1.2;
      fallVel[i] = -(0.25 + Math.random() * 0.25);
    }
    for (let i=0;i<FALL_COUNT;i++) resetFaller(i, true);

    const fallGeo = new THREE.BufferGeometry();
    fallGeo.setAttribute('position', new THREE.BufferAttribute(fallPos, 3));
    const falling = new THREE.Points(
      fallGeo,
      new THREE.PointsMaterial({ map: createCoinTexture('$'), size: 9, transparent: true, depthWrite: false })
    );
    scene.add(falling);

    let t = 0;
    function animate(){
      requestAnimationFrame(animate);
      t += .003;

      pileSets.forEach(ps=>{
        const p = ps.geometry.attributes.position.array;
        for(let i=0;i<COUNT;i++){
          const i3=i*3;
          const wave=Math.sin(t+p[i3]*.012+p[i3+2]*.012)*11.5;
          p[i3+1]+=((SURFACE+wave)-p[i3+1])*.06;
        }
        ps.geometry.attributes.position.needsUpdate=true;
      });

      const fp = fallGeo.attributes.position.array;
      for(let i=0;i<FALL_COUNT;i++){
        const i3=i*3;
        fallVel[i] -= .04;
        fp[i3+1] += fallVel[i];
        if(fp[i3+1] <= SURFACE + 6) resetFaller(i, false);
      }
      fallGeo.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
